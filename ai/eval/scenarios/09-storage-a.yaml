apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: fast-ssd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uploads
  annotations:
    k9sai.eval/expect: storage
    k9sai.eval/wait: event=FailedScheduling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uploads
  template:
    metadata:
      labels:
        app: uploads
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: uploads
        image: busybox:1.36
        command:
        - sleep
        - '3600'
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: uploads-data
