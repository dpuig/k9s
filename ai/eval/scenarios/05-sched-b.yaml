apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-job
  annotations:
    k9sai.eval/expect: unschedulable
    k9sai.eval/wait: event=FailedScheduling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-job
  template:
    metadata:
      labels:
        app: gpu-job
    spec:
      terminationGracePeriodSeconds: 1
      nodeSelector:
        accelerator: nvidia-a100
      containers:
      - name: gpu-job
        image: busybox:1.36
        command:
        - sleep
        - '3600'
