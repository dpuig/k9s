apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  annotations:
    k9sai.eval/expect: probe-failure
    k9sai.eval/wait: restarts>=2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: frontend
        image: busybox:1.36
        command:
        - sh
        - -c
        - echo listening on :8080; sleep 3600
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 2
