apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  annotations:
    k9sai.eval/expect: image-pull
    k9sai.eval/wait: reason=ImagePullBackOff|ErrImagePull
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: worker
        image: registry.invalid/shop/worker:2.1.0
