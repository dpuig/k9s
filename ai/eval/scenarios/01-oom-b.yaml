apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: indexer
  annotations:
    k9sai.eval/expect: oom
    k9sai.eval/wait: restarts>=2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: indexer
        image: busybox:1.36
        command:
        - sh
        - -c
        - echo building index; sleep 3; head -c 500m /dev/zero | tail
        resources:
          limits:
            memory: 64Mi
  serviceName: indexer
