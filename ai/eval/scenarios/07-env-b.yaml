apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  annotations:
    k9sai.eval/expect: bad-env-or-args
    k9sai.eval/wait: reason=RunContainerError|StartError|CrashLoopBackOff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: reporter
        image: busybox:1.36
        command:
        - /app/bin/reporter
        - --serve
