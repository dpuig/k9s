apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
data:
  paymentUrl: http://payments:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  annotations:
    k9sai.eval/expect: missing-config
    k9sai.eval/wait: reason=CreateContainerConfigError
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: checkout
        image: busybox:1.36
        command:
        - sleep
        - '3600'
        env:
        - name: PAYMENT_URL
          valueFrom:
            configMapKeyRef:
              name: checkout-config
              key: payment_url
