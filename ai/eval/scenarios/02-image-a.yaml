apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    k9sai.eval/expect: image-pull
    k9sai.eval/wait: reason=ImagePullBackOff|ErrImagePull
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: api
        image: busybox:does-not-exist-k9sai
        command:
        - sleep
        - '3600'
