apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-shared
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  annotations:
    k9sai.eval/expect: storage
    k9sai.eval/wait: event=FailedScheduling|ProvisioningFailed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: media
        image: busybox:1.36
        command:
        - sleep
        - '3600'
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: media-shared
