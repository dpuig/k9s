apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-janitor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-janitor
  annotations:
    k9sai.eval/expect: rbac
    k9sai.eval/wait: restarts>=2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-janitor
  template:
    metadata:
      labels:
        app: pod-janitor
    spec:
      terminationGracePeriodSeconds: 1
      serviceAccountName: pod-janitor
      containers:
      - name: pod-janitor
        image: curlimages/curl:8.10.1
        command:
        - sh
        - -c
        - 'echo ''listing pods via the API''; NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace); curl -sfk -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          https://kubernetes.default.svc/api/v1/namespaces/$NS/pods -o /tmp/out || (curl -sk -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" https://kubernetes.default.svc/api/v1/namespaces/$NS/pods;
          exit 1)'
