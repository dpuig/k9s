apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  annotations:
    k9sai.eval/expect: unschedulable
    k9sai.eval/wait: event=FailedScheduling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: analytics
        image: busybox:1.36
        command:
        - sleep
        - '3600'
        resources:
          requests:
            memory: 900Gi
            cpu: '1'
