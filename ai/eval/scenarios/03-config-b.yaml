apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailer
  annotations:
    k9sai.eval/expect: missing-config
    k9sai.eval/wait: event=FailedMount
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailer
  template:
    metadata:
      labels:
        app: mailer
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: mailer
        image: busybox:1.36
        command:
        - sleep
        - '3600'
        volumeMounts:
        - name: templates
          mountPath: /etc/templates
      volumes:
      - name: templates
        configMap:
          name: mailer-templates
