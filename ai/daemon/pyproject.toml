[project]
name = "k9sai-daemon"
version = "0.1.0"
description = "Local AI daemon for k9s (see ai/DESIGN.md)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  # Pinned exactly: 0.x SDK, accessed only through k9sai.backend (ADR-0001).
  "google-antigravity==0.1.19",
  "kubernetes>=36,<37",
  "drain3>=0.9.11,<0.10",
  "aiohttp>=3.10,<4",
  "pyyaml>=6,<7",
]

[project.scripts]
k9sai-daemon = "k9sai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k9sai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["k9sai"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]
# The eval harness drives kubectl/kind against its own kind cluster by design.
"**/eval/*.py" = ["S603", "S607"]
